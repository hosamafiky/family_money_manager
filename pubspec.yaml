name: family_money_manager
description: "Family Money Manager — Personal household financial management."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management and dependency injection
  flutter_riverpod: ^3.3.2

  # Navigation
  go_router: ^17.3.0

  # Internationalisation (version constrained by flutter_localizations)
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
