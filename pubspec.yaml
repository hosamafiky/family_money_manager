name: family_money_manager
description: "Family Money Manager — Personal household financial management."
publish_to: "none"
version: 1.0.0+1

environment:
  # sdk: ">=3.12.2 <4.0.0"
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management and dependency injection
  flutter_riverpod: ^3.3.2

  # Navigation
  go_router: ^17.3.0

  # Internationalisation (version constrained by flutter_localizations)
  intl: any
  meta: ^1.18.0
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: ^4.3.1
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

  sqlite3: any
flutter:
  uses-material-design: true
  generate: true

  # Bundled, never fetched at runtime — this is an offline-first app, so
  # typography must not depend on connectivity. Declared here in phase 0 but
  # not yet applied by any text role; phase 3 wires them into
  # AppTextRoles.forLocale. See assets/fonts/OFL.txt for licensing.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-400.ttf
          weight: 400
        - asset: assets/fonts/Archivo-600.ttf
          weight: 600
        - asset: assets/fonts/Archivo-800.ttf
          weight: 800
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700

# sqlite3mc hook: build the sqlite3 native library with SQLite3MultipleCiphers
# encryption support. Accepted in DECISION-004 / PO-2.
# The database key injection is deferred to the security hardening phase.
# Phase 2 opens without a key (unencrypted at rest) but the binary is encryption-ready.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependency_overrides:
  meta: ^1.17.0
